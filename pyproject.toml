[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxo"
version = "0.3.0"
description = "AI-powered CLI file classifier"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
content = [
    "pdfplumber>=0.10",
    "python-docx>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[project.scripts]
taxo = "taxo.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/taxo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
